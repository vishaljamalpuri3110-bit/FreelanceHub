<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
  <div class="container">
    <a class="navbar-brand text-primary-accent fw-bold fs-4" routerLink="/">
      <i class="bi bi-layers-fill me-1"></i> FreelancerHub
    </a>
    
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    
    <div class="collapse navbar-collapse" id="navbarContent">
      <!-- Public Links -->
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link fw-medium" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link fw-medium" routerLink="/freelancers" routerLinkActive="active">Find Freelancers</a>
        </li>
        <li class="nav-item">
          <a class="nav-link fw-medium" routerLink="/projects" routerLinkActive="active">Browse Projects</a>
        </li>
        <li class="nav-item">
          <a class="nav-link fw-medium" routerLink="/how-it-works" routerLinkActive="active">How It Works</a>
        </li>
        <li class="nav-item">
          <a class="nav-link fw-medium" routerLink="/about" routerLinkActive="active">About</a>
        </li>
      </ul>
      
      <!-- Right Side Actions -->
      <div class="d-flex align-items-center">
        <!-- Logged Out State -->
        <ng-container *ngIf="!currentUser()">
          <a routerLink="/login" class="btn btn-link text-decoration-none text-dark fw-medium me-3">Login</a>
          <a routerLink="/register" class="btn btn-primary px-4 fw-medium rounded-pill">Register</a>
        </ng-container>

        <!-- Logged In State -->
        <ng-container *ngIf="currentUser() as user">
          
          <ul class="navbar-nav align-items-center">
            
            <li class="nav-item me-3">
              <a class="nav-link position-relative" routerLink="/notifications">
                <i class="bi bi-bell fs-5"></i>
                <span class="position-absolute top-25 start-75 translate-middle p-1 bg-danger border border-light rounded-circle">
                  <span class="visually-hidden">New alerts</span>
                </span>
              </a>
            </li>

            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                <img [src]="user.avatarUrl" alt="Avatar" class="rounded-circle me-2 border" width="36" height="36">
                <span class="fw-medium d-none d-md-inline">{{ user.name }}</span>
              </a>
              <ul class="dropdown-menu dropdown-menu-end border-0 shadow-sm mt-2" aria-labelledby="userDropdown">
                <li>
                  <a class="dropdown-item py-2" [routerLink]="user.role === 'freelancer' ? '/freelancer/dashboard' : '/client/dashboard'">
                    <i class="bi bi-speedometer2 me-2 text-muted"></i> Dashboard
                  </a>
                </li>
                <li>
                  <a class="dropdown-item py-2" [routerLink]="user.role === 'freelancer' ? '/freelancer/profile' : '/settings'">
                    <i class="bi bi-person me-2 text-muted"></i> Profile
                  </a>
                </li>
                <li><hr class="dropdown-divider"></li>
                <li>
                  <button class="dropdown-item py-2 text-danger" (click)="logout()">
                    <i class="bi bi-box-arrow-right me-2"></i> Logout
                  </button>
                </li>
              </ul>
            </li>
          </ul>
          
        </ng-container>
      </div>
    </div>
  </div>
</nav>
