<div class="container py-5 max-w-800">
  
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold mb-0">Notifications</h2>
    <button class="btn btn-sm btn-outline-primary rounded-pill px-3" (click)="markAllAsRead()">Mark all as read</button>
  </div>

  <div *ngIf="notifications.length === 0" class="text-center py-5 bg-light rounded-lg">
    <i class="bi bi-bell-slash text-muted mb-3 d-block" style="font-size: 3rem;"></i>
    <h5 class="fw-bold text-muted">No notifications</h5>
    <p class="text-muted small">You're all caught up!</p>
  </div>

  <div class="card border-0 shadow-sm">
    <div class="list-group list-group-flush rounded-lg">
      
      <div class="list-group-item border-bottom py-3 p-4 d-flex align-items-start gap-3" 
           *ngFor="let notif of notifications"
           [ngClass]="{'bg-light': !notif.read}">
        
        <div class="mt-1">
          <div class="rounded-circle d-flex justify-content-center align-items-center" style="width: 40px; height: 40px;"
               [ngClass]="{
                 'bg-primary-accent bg-opacity-10 text-primary-accent': notif.type === 'message',
                 'bg-success bg-opacity-10 text-success': notif.type === 'application_accepted' || notif.type === 'project_update',
                 'bg-warning bg-opacity-10 text-warning': notif.type === 'new_application',
                 'bg-danger bg-opacity-10 text-danger': notif.type === 'application_rejected',
                 'bg-secondary bg-opacity-10 text-secondary': notif.type === 'system'
               }">
            <i class="bi" [ngClass]="{
              'bi-chat-dots': notif.type === 'message',
              'bi-check-circle': notif.type === 'application_accepted',
              'bi-x-circle': notif.type === 'application_rejected',
              'bi-file-earmark-text': notif.type === 'new_application',
              'bi-briefcase': notif.type === 'project_update',
              'bi-info-circle': notif.type === 'system'
            }"></i>
          </div>
        </div>

        <div class="flex-grow-1">
          <div class="d-flex justify-content-between align-items-start">
            <h6 class="fw-bold mb-1" [class.text-dark]="!notif.read" [class.text-muted]="notif.read">{{ notif.title }}</h6>
            <small class="text-muted whitespace-nowrap">{{ notif.timestamp | date:'shortTime' }}</small>
          </div>
          <p class="mb-2 text-muted small">{{ notif.message }}</p>
          
          <div class="d-flex align-items-center justify-content-between mt-2">
            <div>
              <a *ngIf="notif.link" [routerLink]="notif.link" class="btn btn-sm btn-outline-primary rounded-pill px-3 py-1" style="font-size: 0.75rem;">View Details</a>
            </div>
            <button *ngIf="!notif.read" class="btn btn-link btn-sm text-decoration-none text-muted p-0" (click)="markAsRead(notif.id)">
              <i class="bi bi-circle"></i> Mark as read
            </button>
          </div>
        </div>

        <div *ngIf="!notif.read" class="align-self-center">
          <span class="p-1 bg-primary-accent border border-light rounded-circle d-inline-block"></span>
        </div>

      </div>

    </div>
  </div>

</div>
