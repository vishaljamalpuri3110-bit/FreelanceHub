<div class="container-fluid min-vh-100 bg-light py-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6 col-xl-5">
      
      <div class="text-center mb-4">
        <h2 class="text-primary-accent fw-bold"><i class="bi bi-layers-fill me-1"></i> FreelancerHub</h2>
        <p class="text-muted">Create your account and join our community</p>
      </div>

      <div class="card shadow-sm border-0">
        <div class="card-body p-4 p-md-5">
          
          <!-- Role Selector -->
          <div class="d-flex mb-4 p-1 bg-light rounded-pill">
            <button class="btn flex-fill rounded-pill fw-medium" 
                    [class.btn-white]="role === 'freelancer'"
                    [class.shadow-sm]="role === 'freelancer'"
                    [class.text-primary-accent]="role === 'freelancer'"
                    [class.text-muted]="role !== 'freelancer'"
                    (click)="setRole('freelancer')">
              Join as Freelancer
            </button>
            <button class="btn flex-fill rounded-pill fw-medium"
                    [class.btn-white]="role === 'client'"
                    [class.shadow-sm]="role === 'client'"
                    [class.text-primary-accent]="role === 'client'"
                    [class.text-muted]="role !== 'client'"
                    (click)="setRole('client')">
              Join as Client
            </button>
          </div>

          <div *ngIf="successMsg" class="alert alert-success py-2 small rounded-lg mb-4">
            <i class="bi bi-check-circle me-1"></i> {{ successMsg }}
          </div>

          <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
            
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label fw-medium small">Full Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control" formControlName="fullName" placeholder="John Doe"
                       [class.is-invalid]="registerForm.get('fullName')?.invalid && registerForm.get('fullName')?.touched">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-medium small">Email Address <span class="text-danger">*</span></label>
                <input type="email" class="form-control" formControlName="email" placeholder="john@example.com"
                       [class.is-invalid]="registerForm.get('email')?.invalid && registerForm.get('email')?.touched">
              </div>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label fw-medium small">Password <span class="text-danger">*</span></label>
                <input type="password" class="form-control" formControlName="password" placeholder="Min 8 chars"
                       [class.is-invalid]="registerForm.get('password')?.invalid && registerForm.get('password')?.touched">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-medium small">Confirm Password <span class="text-danger">*</span></label>
                <input type="password" class="form-control" formControlName="confirmPassword" placeholder="Repeat password"
                       [class.is-invalid]="(registerForm.get('confirmPassword')?.invalid || registerForm.hasError('mismatch')) && registerForm.get('confirmPassword')?.touched">
                <div class="invalid-feedback" *ngIf="registerForm.hasError('mismatch')">Passwords do not match.</div>
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label fw-medium small">Location <span class="text-danger">*</span></label>
              <input type="text" class="form-control" formControlName="location" placeholder="City, Country"
                     [class.is-invalid]="registerForm.get('location')?.invalid && registerForm.get('location')?.touched">
            </div>

            <hr class="my-4">

            <!-- Freelancer Fields -->
            <div *ngIf="role === 'freelancer'">
              <h5 class="fw-bold mb-3 fs-6">Professional Details</h5>
              
              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label class="form-label fw-medium small">Skills (comma separated)</label>
                  <input type="text" class="form-control" formControlName="skills" placeholder="e.g. Angular, UI/UX">
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-medium small">Hourly Rate ($)</label>
                  <input type="number" class="form-control" formControlName="hourlyRate" placeholder="e.g. 50">
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label fw-medium small">Experience Level</label>
                <select class="form-select" formControlName="experience">
                  <option value="" disabled selected>Select level...</option>
                  <option value="beginner">Beginner (1-3 yrs)</option>
                  <option value="intermediate">Intermediate (3-5 yrs)</option>
                  <option value="expert">Expert (5+ yrs)</option>
                </select>
              </div>
              
              <div class="mb-4">
                <label class="form-label fw-medium small">Bio</label>
                <textarea class="form-control" formControlName="bio" rows="3" placeholder="Tell clients about yourself..."></textarea>
              </div>
            </div>

            <!-- Client Fields -->
            <div *ngIf="role === 'client'">
              <h5 class="fw-bold mb-3 fs-6">Company Details</h5>
              
              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label class="form-label fw-medium small">Company Name</label>
                  <input type="text" class="form-control" formControlName="companyName" placeholder="e.g. Innovatech">
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-medium small">Industry</label>
                  <input type="text" class="form-control" formControlName="industry" placeholder="e.g. Technology">
                </div>
              </div>
              
              <div class="mb-4">
                <label class="form-label fw-medium small">Company Description</label>
                <textarea class="form-control" formControlName="companyDescription" rows="3" placeholder="What does your company do?"></textarea>
              </div>
            </div>

            <div class="form-check mb-4">
              <input type="checkbox" class="form-check-input" id="terms" formControlName="terms"
                     [class.is-invalid]="registerForm.get('terms')?.invalid && registerForm.get('terms')?.touched">
              <label class="form-check-label small text-muted" for="terms">
                I agree to the <a href="#" class="text-primary-accent text-decoration-none">Terms and Conditions</a> and <a href="#" class="text-primary-accent text-decoration-none">Privacy Policy</a>
              </label>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 mb-3 fw-medium">Create Account</button>
            
          </form>

        </div>
        <div class="card-footer bg-white border-top-0 text-center pb-4 pt-0">
          <p class="text-muted small mb-0">
            Already have an account? <a routerLink="/login" class="text-primary-accent fw-bold text-decoration-none">Log in</a>
          </p>
        </div>
      </div>
      
    </div>
  </div>
</div>
